# Configuração do Commitizen (https://commitizen-tools.github.io/commitizen/).
#
# - `cz commit` guia a mensagem no padrão Conventional Commits;
# - `cz bump` calcula a próxima versão pelos commits desde a última tag,
#   atualiza a versão abaixo e em config/app.php, gera o CHANGELOG.md e
#   cria a tag vX.Y.Z.
#
# A versão é exibida em GET /api e no rodapé do blog-front.
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.1"
version_scheme = "semver2"
tag_format = "v$version"
version_files = ["config/app.php:'version'"]
update_changelog_on_bump = true
# Enquanto estiver em 0.x, mudanças incompatíveis sobem o minor, não o major.
major_version_zero = true
